# 네이버 블로그 자동화 설정

[naver]
blog_id = "여기에_블로그_아이디"   # blog.naver.com/<이 부분>

[publish]
# false(기본): 에디터에 입력 후 "임시저장"까지만. 발행 버튼은 직접 누르세요.
# true: 자동 발행. 네이버 운영정책 위반 소지가 있고 저품질/정지 위험이 있습니다.
auto_publish = false
max_posts_per_day = 5        # 하루 최대 임시저장 개수 (발행은 직접, 하루 3~4개 권장)
max_posts_per_run = 5        # 한 번 실행할 때 처리 개수
start_jitter_minutes = [0, 90]    # 실행 시작 전 랜덤 대기(분). cron 시각을 매일 다르게 만드는 용도
between_posts_minutes = [40, 120] # 글과 글 사이 랜덤 대기(분)
headless = false             # 처음엔 false로 동작을 눈으로 확인하세요

[images]
thumbnail = true        # 글 맨 위에 제목 썸네일 카드 자동 생성
summary_card = true     # 글 끝에 "한눈에 정리" 카드 자동 생성
stock_photos = true     # 직접 찍은 사진이 없는 소제목에 Pixabay 무료 사진 넣기 (pixabay_key.txt 필요)
max_stock_photos = 3    # 글 하나에 넣을 무료 사진 최대 개수

[writing]
model = "claude-opus-5"
min_chars = 1500
max_chars = 2500
tone = "친근한 구어체, 존댓말, 과장 없이 담백하게"
voice = "short"         # "short": 짧은 호흡(한 줄 한 문장, 1. 2. 3. 번호), "standard": 정리형 문단
style = "homefeed"      # "homefeed": 네이버 홈판 노출용 제목/구성, "normal": 일반 정보글
research = true         # 글 쓰기 전에 웹 검색으로 최신 정보 확인 (글당 비용 조금 증가)
max_searches = 5        # 글 하나당 최대 검색 횟수

[style]
heading_size = 24          # 소제목 글자 크기 (본문은 네이버 기본 19)
heading_color = "#00756a"  # 소제목 색 (청록)
q_color = "#00756a"        # Q&A 질문 색
a_color = "#666666"        # Q&A 답변 색 (회색)
intro_color = "#777777"    # 도입 3줄 색 (회색)
intro_bold = true          # 도입 3줄 굵게
quote_style = "포스트잇"      # 핵심 한 줄 인용구 모양: 따옴표, 버티컬 라인, 말풍선, 라인&따옴표, 포스트잇, 프레임
divider_style = 3              # 소제목 위 구분선 모양 (구분선 목록에서 위에서 몇 번째, 0이면 안 넣음)
heading_box = "버티컬 라인"      # 소제목을 넣을 인용구 모양 ("" 이면 상자 없이 글자만)
