# 네이버 블로그 자동화 설정

[naver]
blog_id = "여기에_블로그_아이디"   # blog.naver.com/<이 부분>

[publish]
# false(기본): 에디터에 입력 후 "임시저장"까지만. 발행 버튼은 직접 누르세요.
# true: 자동 발행. 네이버 운영정책 위반 소지가 있고 저품질/정지 위험이 있습니다.
auto_publish = false
max_posts_per_day = 2         # 새 블로그는 하루 1~2개가 안전해요
max_posts_per_run = 5        # 한 번 실행할 때 처리 개수
start_jitter_minutes = [0, 90]    # 실행 시작 전 랜덤 대기(분). cron 시각을 매일 다르게 만드는 용도
between_posts_minutes = [40, 120] # 글과 글 사이 랜덤 대기(분)
headless = false             # 처음엔 false로 동작을 눈으로 확인하세요

[images]
thumbnail = true        # 글 맨 위에 제목 썸네일 카드 자동 생성
summary_card = true     # 글 끝에 "한눈에 정리" 카드 자동 생성
stock_photos = true     # 직접 찍은 사진이 없는 소제목에 Pixabay 무료 사진 넣기 (pixabay_key.txt 필요)
max_stock_photos = 3    # 글 하나에 넣을 무료 사진 최대 개수
# AI 그림 (google_key.txt 필요). illustration = 블로그 캐릭터 일러스트(소제목 그림에 제목·핵심 글자), photo = 글자 없는 사진 느낌
# ai_style = "illustration"
# ai_character = "동그란 안경을 쓴 단발머리 한국인 캐릭터, 밝은 표정, 베이지 가디건"   # 비워 두면 블로그 종류별 기본 캐릭터
# ai_color = "싱그러운 초록(#2f9e44)과 연한 민트"

[writing]
model = "claude-opus-5"
min_chars = 1500
max_chars = 2500
tone = "친근한 구어체, 존댓말, 과장 없이 담백하게"
voice = "short"         # "short": 짧은 호흡(한 줄 한 문장, 1. 2. 3. 번호), "standard": 정리형 문단
style = "homefeed"      # "homefeed": 네이버 홈판 노출용 제목/구성, "normal": 일반 정보글
research = true         # 글 쓰기 전에 웹 검색으로 최신 정보 확인 (글당 비용 조금 증가)
max_searches = 5        # 글 하나당 최대 검색 횟수
threads = true          # 스레드(Threads)용 연속 게시물도 output 폴더에 같이 만들기 (글당 비용 조금 추가)

[autofill]
# keywords.csv 에 쓸 키워드가 떨어지면 자동으로 골라 넣고 글을 써요 (발행은 안 하고 임시저장까지만)
enabled = true
mix = "evergreen,trending"   # 평생 키워드 + 지금 뜨는 키워드를 번갈아 (홈판 유입이 많으면 "trending,trending,evergreen" = 2:1)
count = 0                    # 한 번에 몇 개 (0 = 하루 최대 글 수만큼)

[style]
heading_size = 24          # 소제목 글자 크기 (본문은 네이버 기본 19)
heading_color = "#00756a"  # 소제목 색 (청록)
q_color = "#00756a"        # Q&A 질문 색
a_color = "#666666"        # Q&A 답변 색 (회색)
intro_color = "#777777"    # 도입 3줄 색 (회색)
intro_bold = true          # 도입 3줄 굵게
quote_style = "포스트잇"      # 핵심 한 줄 인용구 모양: 따옴표, 버티컬 라인, 말풍선, 라인&따옴표, 포스트잇, 프레임
divider_style = 3              # 소제목 위 구분선 모양 (구분선 목록에서 위에서 몇 번째, 0이면 안 넣음)
heading_box = "버티컬 라인"      # 소제목을 넣을 인용구 모양 ("" 이면 상자 없이 글자만)
heading_format = false        # true: 소제목에 편집기 '소제목' 서식도 입힘 (상자가 풀려 일반 글씨처럼 보일 수 있음)
key_color = "#d9480f"          # 소제목마다 핵심 한 줄 색 (주황)
key_underline = true           # 핵심 한 줄 밑줄
quote_size = 19                # 인용구(포스트잇) 안 글자 크기
quote_color = "#00756a"        # 인용구 안 글자 색 (비우면 소제목 색과 같게)

[clip]
# true면 글을 쓸 때마다 네이버 클립용 세로 영상(mp4)도 같이 만든다. 따로 만들려면 8_make_clip.bat
auto = false
# 목소리: ko-KR-SunHiNeural(여자) 또는 ko-KR-InJoonNeural(남자)
voice = "ko-KR-SunHiNeural"
# 빠르기: "+0%"가 보통, "+15%"는 조금 빠르게, "+30%"는 빠르게
speed = "+15%"
# 인터넷 음성이 안 될 때 쓰는 윈도우 기본 목소리 빠르기 (보통 180~250)
voice_rate = 220
# music 폴더에 넣은 배경음악 크기 (0.05 아주 작게 ~ 0.25 크게)
music_volume = 0.12
# 글 안(첫 소제목 뒤)에도 이 짧은 영상을 넣는다 (체류 시간). 끄려면 false
in_post = true
# 글 안에는 블로그 화면에 맞는 가로 영상을 따로 만들어 넣는다 (세로 클립은 클립 업로드용으로 그대로)
blog_wide = true
# 세로 클립 모양: "shorts" = 검은 바탕 + 위에 고정 제목 두 줄 + 가운데 그림 + 아래 자막 / "card" = 예전 흐린 배경 모양
style = "shorts"
# 배경음악: "auto" = music 폴더의 음악, 비어 있으면 프로그램이 만든 잔잔한 소리 / "none" = 음악 없이
music = "auto"
